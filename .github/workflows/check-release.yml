name: Check release tooling

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
